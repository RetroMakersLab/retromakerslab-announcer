<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier de partage RetroMakersLab</title>
<meta name="description" content="Colle le lien d'une vidéo RetroMakersLab : un texte prêt à copier pour X, Facebook, Reddit, Discord et la communauté YouTube.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d9560b'/%3E%3Cpath d='M8 23V9h8a4.5 4.5 0 0 1 1 8.9L22 23h-4l-4.2-4.8H11.5V23z M11.5 12v3.4H16a1.7 1.7 0 0 0 0-3.4z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Mise en page : colonne de saisie à gauche (collante), une carte par réseau à droite ; une seule colonne sur téléphone. */
:root {
  --bg: #f3f1ee; --panel: #fbfaf8; --fg: #1b2230; --muted: #5d6677; --line: #d9d5ce;
  --accent: #c24a07; --accent-fg: #ffffff; --ok: #1f7a46; --warn: #8f5208; --bad: #b3261e; --field: #ffffff;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a26; --panel: #1a2333; --fg: #e8ecf3; --muted: #9aa5b8; --line: #2c374b;
    --accent: #ff8a3d; --accent-fg: #1a1208; --ok: #5fcf8b; --warn: #f0b050; --bad: #ff8a80; --field: #0f1520;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a26; --panel: #1a2333; --fg: #e8ecf3; --muted: #9aa5b8; --line: #2c374b;
  --accent: #ff8a3d; --accent-fg: #1a1208; --ok: #5fcf8b; --warn: #f0b050; --bad: #ff8a80; --field: #0f1520;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-inline: 16px; padding-block: 24px 48px; }
.wrap { max-width: 1120px; margin-inline: auto; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 24px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1.15; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); flex: 1 1 260px; min-width: 0; }
.panel, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
.layout { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 24px; align-items: start; }
.panel { position: sticky; top: 16px; }
@media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } .panel { position: static; } }
label, .lbl { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
input[type=text], input[type=url], textarea, select { width: 100%; font: inherit; color: var(--fg); background: var(--field);
  border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
select { text-overflow: ellipsis; }
textarea { resize: vertical; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.field { margin-bottom: 14px; }
.hint { font-size: .82rem; color: var(--muted); margin: 6px 0 0; min-height: 1.3em; }
.hint.bad { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: .82rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--field); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.cards { display: grid; gap: 16px; min-width: 0; }
.card h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0; font-weight: 700; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.meta { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta.over { color: var(--bad); font-weight: 500; }
.card textarea { font-family: var(--font-mono); font-size: .85rem; line-height: 1.5; min-height: 130px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.btn { font: inherit; font-weight: 600; font-size: .88rem; padding: 7px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--field); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.done { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.btn:hover:not([aria-disabled="true"]):not(:disabled) { filter: brightness(1.07); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; pointer-events: none; }
.note { font-size: .82rem; color: var(--muted); margin: 8px 0 0; }
.note.warn { color: var(--warn); }
.sub { margin-top: 10px; }
.sub input { font-family: var(--font-mono); font-size: .85rem; }
.toggle { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 4px; font: inherit; font-size: .8rem; padding: 4px 10px; cursor: pointer; }
details summary { cursor: pointer; margin-bottom: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .btn { transition: filter .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Atelier de partage</h1>
    <p>Choisis une vidéo ou colle son lien : un texte prêt à copier pour chaque réseau.</p>
    <button class="toggle" id="theme" type="button">Thème</button>
  </header>

  <main class="layout">
    <section class="panel" aria-label="La vidéo">
      <div class="field">
        <label for="recent">Vidéos récentes</label>
        <select id="recent"><option value="">Chargement…</option></select>
      </div>
      <div class="field">
        <label for="url">Ou colle un lien</label>
        <input type="url" id="url" placeholder="https://youtu.be/…" autocomplete="off" spellcheck="false">
        <div class="actions"><button class="btn primary" id="paste" type="button">Coller le lien</button></div>
        <p class="hint" id="status" role="status" aria-live="polite"></p>
      </div>
      <div class="field">
        <span class="lbl">Thèmes (hashtags)</span>
        <div class="chips" id="chips"></div>
      </div>
      <details id="more">
        <summary class="lbl">Modifier</summary>
        <div class="field"><label for="title">Titre</label><input type="text" id="title" autocomplete="off"></div>
        <div class="field"><label for="hook">Accroche</label><textarea id="hook" rows="3"></textarea></div>
        <div class="field"><label for="ask">Question pour la communauté</label><input type="text" id="ask" autocomplete="off"></div>
      </details>
      <p class="note">Chaque texte reste modifiable avant de copier.</p>
    </section>

    <section class="cards" id="cards" aria-label="Textes par réseau"></section>
  </main>
</div>

<script>
"use strict";
const LINKS = {
  site: "https://retromakerslab.fr",
  discord: "https://discord.com/invite/Rztt735cep",
  youtube: "https://www.youtube.com/@RetroMakersLab"
};
const DATA_URL = "https://raw.githubusercontent.com/RetroMakersLab/retromakerslab-announcer/main/videos.json";
const DEFAULT_ASK = "Et toi, tu as déjà essayé ?";

const TOPICS = [
  { id: "retro", label: "Rétro-informatique", tags: ["#RetroComputing", "#Amiga", "#C64"], re: /amiga|c64|commodore|atari|retro|rétro|vintage|msx|spectrum|amstrad|minitel|apple ii|fpga|mister/i },
  { id: "radio", label: "CIBI / radio", tags: ["#CIBI", "#Radioamateur", "#SDR"], re: /cibi|\bcb\b|radio|sdr|\bhf\b|antenne|talkie|rtl|uv-?k5|27 ?mhz/i },
  { id: "maker", label: "Maker / 3D", tags: ["#Maker", "#Impression3D", "#DIY"], re: /\b3d\b|imprim|maker|diy|filament|creality|bambu|prusa/i },
  { id: "mesh", label: "Meshtastic", tags: ["#Meshtastic", "#LoRa"], re: /meshtastic|lora|mesh/i },
  { id: "elec", label: "Électronique", tags: ["#Electronique", "#Arduino"], re: /arduino|esp32|esp8266|pcb|jlcpcb|électronique|electronique|soudure|raspberry|pico/i }
];

const $ = (id) => document.getElementById(id);
const state = { topics: new Set(["retro"]), dirty: {}, videos: [], byId: {}, loaded: false };

/* ---------- Données de la vidéo ---------- */
function videoId(raw) {
  const s = (raw || "").trim();
  if (!s) return "";
  try {
    const u = new URL(/^https?:\/\//i.test(s) ? s : "https://" + s);
    if (u.hostname === "youtu.be") return u.pathname.slice(1).split("/")[0];
    if (/^\/(shorts|live|embed)\//.test(u.pathname)) return u.pathname.split("/")[2] || "";
    return u.searchParams.get("v") || "";
  } catch (e) { return ""; }
}
const watchUrl = (id) => "https://www.youtube.com/watch?v=" + id;

function hookFrom(desc) {
  const lines = (desc || "").split(/\n/).map(l => l.replace(/#\S+/g, "").trim()).filter(l => /^[\p{L}\p{N}]/u.test(l) && !/^(https?:|bienvenue)/i.test(l) && !l.includes("http"));
  let line = lines[0] || "";
  const cut = line.search(/[.!?](\s|$)/);
  if (cut > 20) line = line.slice(0, cut + 1);
  if (line.length > 200) line = line.slice(0, 200).replace(/\s+\S*$/, "") + "…";
  return line.length >= 15 ? line : "";
}
function guessTopics(text) {
  const found = TOPICS.filter(t => t.re.test(text)).map(t => t.id);
  return new Set(found.length ? found : ["retro"]);
}
function tags(max) {
  // Un hashtag par thème d'abord, puis les suivants : chaque thème garde sa place même sur X.
  const picked = TOPICS.filter(t => state.topics.has(t.id));
  const out = ["#RetroMakersLab"];
  for (let i = 0; i < 3; i++) picked.forEach(t => { if (t.tags[i]) out.push(t.tags[i]); });
  return out.slice(0, max);
}
function current() {
  const id = videoId($("url").value);
  return {
    ready: !!id && !!$("title").value.trim(),
    url: id ? watchUrl(id) : "",
    title: $("title").value.trim(),
    hook: $("hook").value.trim(),
    ask: $("ask").value.trim()
  };
}

/* ---------- Réseaux ---------- */
const NETWORKS = [
  {
    id: "x", name: "X", limit: 280,
    build(v) {
      const t = tags(3).join(" ");
      const room = 280 - (2 + 23 + 2 + t.length);
      let head = v.hook && (v.title + " : " + v.hook).length <= room ? v.title + " : " + v.hook : v.title;
      if (head.length > room) head = head.slice(0, Math.max(0, room - 1)).trimEnd() + "…";
      return head + "\n\n" + v.url + "\n\n" + t;
    },
    len(text, v) { return v.url ? text.split(v.url).join("x".repeat(23)).length : text.length; },
    open(text) { return "https://x.com/intent/post?text=" + encodeURIComponent(text); },
    openLabel: "Ouvrir X avec le texte",
    note: "Le lien compte pour 23 caractères, comme sur X."
  },
  {
    id: "facebook", name: "Facebook", limit: 5000,
    build(v) {
      return "Nouvelle vidéo sur RetroMakersLab : " + v.title + "\n\n" + (v.hook ? v.hook + "\n\n" : "") + v.url +
        (v.ask ? "\n\n" + v.ask : "") + "\n\n" + tags(4).join(" ");
    },
    open(text, v) { return "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(v.url); },
    openLabel: "Ouvrir Facebook",
    note: "Facebook ne pré-remplit pas le texte : copie-le, puis colle-le dans la fenêtre qui s'ouvre."
  },
  {
    id: "reddit", name: "Reddit", limit: 300, split: true,
    build(v) {
      return { title: v.title, body: (v.hook ? v.hook + "\n\n" : "") + "La vidéo complète (en français) : " + v.url + (v.ask ? "\n\n" + v.ask : "") };
    },
    open(text, v, extra) { return "https://www.reddit.com/submit?type=link&url=" + encodeURIComponent(v.url) + "&title=" + encodeURIComponent(extra.title); },
    openLabel: "Ouvrir Reddit",
    warn: "À poster seulement dans un sous-reddit qui autorise l'auto-promotion, après quelques semaines de commentaires. Garde environ 9 contenus sans promo pour 1 avec."
  },
  {
    id: "discord", name: "Discord", limit: 2000,
    build(v) {
      return "Nouvelle vidéo sur RetroMakersLab : **" + v.title + "**\n" + (v.hook ? v.hook + "\n" : "") + v.url + (v.ask ? "\n\n" + v.ask : "");
    },
    open() { return LINKS.discord; },
    openLabel: "Ouvrir le Discord",
    note: "L'annonce part déjà toute seule dans ton salon d'annonces. Ce texte sert à relancer la discussion ailleurs."
  },
  {
    id: "community", name: "Communauté YouTube", limit: 1500,
    build(v) {
      return "Nouvelle vidéo : " + v.title + "\n" + (v.hook ? v.hook + "\n" : "") + (v.ask ? "\n" + v.ask : "") + "\n\nDis-le moi en commentaire !";
    },
    open() { return "https://studio.youtube.com/"; },
    openLabel: "Ouvrir YouTube Studio",
    note: "Onglet Communauté, sans lien : la vidéo s'attache au post."
  }
];

const textOf = (n) => $(n.id + "-text");
function buildCards() {
  const host = $("cards");
  NETWORKS.forEach(n => {
    const card = document.createElement("article");
    card.className = "card";
    const rows = n.split
      ? `<div class="sub"><label for="${n.id}-title">Titre du post</label><input type="text" id="${n.id}-title"></div>
         <div class="sub"><label for="${n.id}-text">Texte</label><textarea id="${n.id}-text" rows="6"></textarea></div>`
      : `<label class="sr" for="${n.id}-text">Texte pour ${n.name}</label><textarea id="${n.id}-text" rows="7"></textarea>`;
    card.innerHTML = `<div class="card-head"><h2>${n.name}</h2><span class="meta" id="${n.id}-meta"></span></div>${rows}
      <div class="actions">
        <button class="btn primary" type="button" data-copy="${n.id}">Copier</button>
        <a class="btn" id="${n.id}-open" target="_blank" rel="noopener noreferrer">${n.openLabel}</a>
        <button class="btn" type="button" data-reset="${n.id}">Régénérer</button>
      </div>
      ${n.warn ? `<p class="note warn">${n.warn}</p>` : ""}${n.note ? `<p class="note">${n.note}</p>` : ""}`;
    host.appendChild(card);
    textOf(n).addEventListener("input", () => { state.dirty[n.id] = true; refreshMeta(n); });
    if (n.split) $(n.id + "-title").addEventListener("input", () => { state.dirty[n.id] = true; refreshMeta(n); });
  });
}

function fill(n, force) {
  const v = current();
  if (!force && state.dirty[n.id]) { refreshMeta(n); return; }
  state.dirty[n.id] = false;
  const ta = textOf(n);
  if (!v.ready) {
    ta.value = ""; ta.placeholder = "Choisis une vidéo pour générer le texte.";
    if (n.split) $(n.id + "-title").value = "";
  } else {
    const out = n.build(v);
    if (n.split) { $(n.id + "-title").value = out.title; ta.value = out.body; } else ta.value = out;
  }
  refreshMeta(n);
}
function refreshMeta(n) {
  const v = current();
  const text = textOf(n).value;
  const extra = n.split ? { title: $(n.id + "-title").value } : null;
  const len = n.len ? n.len(text, v) : (n.split ? extra.title.length : text.length);
  const meta = $(n.id + "-meta");
  meta.textContent = len + " / " + n.limit;
  meta.classList.toggle("over", len > n.limit);
  const open = $(n.id + "-open");
  const empty = !text.trim();
  open.setAttribute("aria-disabled", empty ? "true" : "false");
  open.tabIndex = empty ? -1 : 0;
  if (empty) open.removeAttribute("href"); else open.href = n.open(text, v, extra);
  const copy = document.querySelector(`[data-copy="${n.id}"]`);
  if (copy) copy.disabled = empty;
}
const refreshAll = (force) => NETWORKS.forEach(n => fill(n, force));

/* ---------- Sélection d'une vidéo ---------- */
function setStatus(msg, bad) { const s = $("status"); s.textContent = msg; s.classList.toggle("bad", !!bad); }
function syncChips() {
  document.querySelectorAll("#chips .chip").forEach(b => b.setAttribute("aria-pressed", String(state.topics.has(b.dataset.id))));
}
function selectVideo(v) {
  $("title").value = v.title;
  $("hook").value = hookFrom(v.description);
  if (!$("ask").value) $("ask").value = DEFAULT_ASK;
  state.topics = guessTopics(v.title + " " + (v.description || ""));
  syncChips();
}
function onUrlChange() {
  const raw = $("url").value.trim();
  const sel = $("recent");
  if (!raw) { setStatus(""); return; }
  const id = videoId(raw);
  if (!id) { setStatus("Ce lien ne ressemble pas à une vidéo YouTube.", true); $("title").value = ""; refreshAll(true); return; }
  const v = state.byId[id];
  sel.value = v ? id : "";
  if (v) { selectVideo(v); setStatus("Vidéo trouvée : " + v.title); }
  else if (state.loaded) {
    $("title").value = ""; $("hook").value = "";
    setStatus("Titre introuvable (vidéo hors des 15 dernières). Écris-le dans « Modifier ».", true);
    $("more").open = true;
  } else { setStatus("Liste des vidéos indisponible. Écris le titre dans « Modifier »."); $("more").open = true; }
  refreshAll(true);
}

async function loadVideos() {
  const sel = $("recent");
  try {
    const r = await fetch(DATA_URL, { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    state.videos = (await r.json()).filter(v => v && v.id && v.title);
    state.videos.forEach(v => { state.byId[v.id] = v; });
    state.loaded = true;
  } catch (e) { state.loaded = false; }
  sel.textContent = "";
  if (!state.videos.length) {
    sel.add(new Option("Liste indisponible : colle un lien", ""));
    setStatus("Impossible de charger tes vidéos. Colle un lien et écris le titre dans « Modifier ».", true);
    $("more").open = true;
    return;
  }
  sel.add(new Option("Choisir une vidéo…", ""));
  state.videos.forEach(v => {
    const d = v.published ? new Date(v.published).toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) : "";
    sel.add(new Option((d ? d + " · " : "") + v.title, v.id));
  });
  if (!$("url").value.trim()) {
    sel.value = state.videos[0].id;
    $("url").value = watchUrl(state.videos[0].id);
  }
  onUrlChange();
}

/* ---------- Actions ---------- */
async function copyText(text, btn) {
  const label = btn.textContent;
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = "Copié"; btn.classList.add("done");
    setTimeout(() => { btn.textContent = label; btn.classList.remove("done"); }, 1400);
  } catch (e) {
    const ta = btn.closest(".card").querySelector("textarea");
    ta.focus(); ta.select();
    btn.textContent = "Sélectionné : Ctrl+C";
    setTimeout(() => { btn.textContent = label; }, 2200);
  }
}

function init() {
  buildCards();
  TOPICS.forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = t.label; b.dataset.id = t.id;
    b.addEventListener("click", () => {
      state.topics.has(t.id) ? state.topics.delete(t.id) : state.topics.add(t.id);
      syncChips(); refreshAll(true);
    });
    $("chips").appendChild(b);
  });
  syncChips();
  $("ask").value = DEFAULT_ASK;

  $("recent").addEventListener("change", (e) => { if (e.target.value) { $("url").value = watchUrl(e.target.value); onUrlChange(); } });
  $("url").addEventListener("input", onUrlChange);
  ["title", "hook", "ask"].forEach(id => $(id).addEventListener("input", () => refreshAll(true)));
  $("paste").addEventListener("click", async () => {
    try { $("url").value = await navigator.clipboard.readText(); onUrlChange(); }
    catch (e) { setStatus("Collage refusé par le navigateur : colle le lien avec Ctrl+V dans la case.", true); $("url").focus(); }
  });
  $("cards").addEventListener("click", (e) => {
    const c = e.target.closest("[data-copy]");
    if (c) {
      const n = NETWORKS.find(x => x.id === c.dataset.copy);
      const body = textOf(n).value;
      copyText(n.split ? $(n.id + "-title").value + "\n\n" + body : body, c);
      return;
    }
    const r = e.target.closest("[data-reset]");
    if (r) fill(NETWORKS.find(x => x.id === r.dataset.reset), true);
  });
  $("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });
  refreshAll(true);
  loadVideos();
}
init();
</script>
</body>
</html>
